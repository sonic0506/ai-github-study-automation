# github-ai-discovery / github-star-analyzer 설정
# 값은 언제든 변경 가능하며, 코드에서는 src/core/config.ts 의 Zod 스키마로 검증된다.

topics:
  - artificial-intelligence
  - llm
  - generative-ai
  - ai-agent
  - agents
  - rag
  - mcp

minimum_stars: 100

search:
  # topic 하나당 GitHub Search에서 가져올 최대 Repository 수 (Star 순, 최대 1000)
  max_results_per_topic: 50
  # 최근 N일 이내 push된 Repository만 대상 (0이면 제한 없음)
  pushed_within_days: 180
  exclude_archived: true
  exclude_forks: true

# 급성장 신규 저장소 보완 검색: topic별로 최근 N일 안에 생성된 저장소를 Star 순으로 추가 수집
new_repositories:
  enabled: true
  created_within_days: 30
  minimum_stars: 100
  max_results_per_topic: 30

# Registry에 등록된 저장소가 검색 결과에서 빠져도 개별 조회로 Star 수를 계속 기록
tracking:
  registered: true
  # 하루 최대 개별 조회 수 (일반 API 한도 보호: 인증 시 시간당 5,000회)
  max_lookups: 300

# 수집에서 완전히 제외할 저장소 (대소문자 무시)
# AI 도구/라이브러리가 아니지만 AI 관련 topic 태그 때문에 잡히는 경우에 사용.
# 애매한 경우는 여기 넣지 말고 Study 단계의 적합성 판정(github-researcher)에 맡긴다.
exclude:
  repositories:
    - Snailclimb/JavaGuide   # Java 백엔드 면접 가이드 (mcp/agent 태그로 수집됨)

ranking:
  top_n: 10
  # Growth TOP10에 포함되기 위한 최소 24h 증가량 (0 이하 증가는 제외)
  growth_min_delta: 1
