# github-ai-discovery / github-star-analyzer 설정
# 값은 언제든 변경 가능하며, 코드에서는 src/core/config.ts 의 Zod 스키마로 검증된다.

topics:
  - artificial-intelligence
  - llm
  - generative-ai
  - ai-agent
  - agents
  - rag
  - mcp

minimum_stars: 100

search:
  # topic 하나당 GitHub Search에서 가져올 최대 Repository 수
  max_results_per_topic: 50
  # 최근 N일 이내 push된 Repository만 대상 (0이면 제한 없음)
  pushed_within_days: 180
  exclude_archived: true
  exclude_forks: true

ranking:
  top_n: 10
  # Growth TOP10에 포함되기 위한 최소 24h 증가량 (0 이하 증가는 제외)
  growth_min_delta: 1
