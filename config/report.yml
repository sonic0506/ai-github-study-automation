# daily-report-writer 설정

# 신규 저장소는 Star 순 상위 N개만 표시하고 나머지는 개수로 요약한다
# (첫 실행처럼 수백 개가 신규로 잡히는 날 리포트가 길어지지 않게)
newly_discovered_limit: 10

# 한 줄 요약(GitHub 설명문)을 자를 길이. 넘으면 … 로 끝난다
description_max_length: 80

# Telegram 요약에 넣을 Growth 상위 개수
telegram_growth_top: 3

# 리포트 저장 경로 (Repository 루트 기준, {date} 치환)
report_path: reports/daily/{date}.md
