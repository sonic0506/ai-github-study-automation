name: Daily AI GitHub report

# 매일 06:00 KST (21:00 UTC) 에 수집 → 분석 → 리포트 → 커밋 → Telegram 알림
# Study 초안은 포함하지 않는다 (Claude 가 필요한 단계라 Cowork 에서 따로 작성).
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 실행 날짜 (YYYY-MM-DD, 비우면 오늘)
        required: false
      dry_run:
        description: 파일을 바꾸지 않고 수집만 확인
        type: boolean
        default: false

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGS_DATA_DIR: data
      AGS_TIMEZONE: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 수집 · 분석 · 리포트
        run: |
          set -euo pipefail
          ARGS=""
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          npm run daily -- $ARGS

      - name: 커밋
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: daily report $(date -u -d '9 hours' +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Telegram 알림
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          npm run notify -- --file output/notify/latest.md \
            --suffix "🔗 ${{ github.server_url }}/${{ github.repository }}/tree/main/reports/daily"

      - name: 실패 알림
        if: failure()
        run: |
          set -uo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          npm run notify -- --text "⚠️ AI GitHub Daily 실패 — 로그: $RUN_URL" || echo "알림 전송 실패"

      - name: 요약
        if: always()
        run: |
          {
            echo "### Daily report"
            if [ -f output/notify/latest.md ]; then
              echo '```'
              cat output/notify/latest.md
              echo '```'
            else
              echo "- 리포트가 생성되지 않았습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
